# The configuration API version is independent of the oiax release major:
# oiax 2.x still reads oiax.skaphos.dev/v1. Do not bump this to /v2.
# https://github.com/skaphos/oiax/blob/main/docs/guides/upgrading-v2.md
apiVersion: oiax.skaphos.dev/v1
kind: PromotionGraph

metadata:
  name: environments

spec:
  branches:
    development:
      role: source
    # test and qa are transit branches (content reaches them only by
    # promotion). This repo merges via rebase, which leaves a destination-only
    # commit on each promotion; drift: expected acknowledges that residue so it
    # is not reported as a divergence. Why, and the fast-forward alternative:
    # https://github.com/skaphos/oiax/blob/main/docs/guides/promotion-graphs.md#transit-branches-and-merge-residue
    test:
      drift: expected
    qa:
      drift: expected
    production-stage-1: {}
    main:
      role: terminal

  promotions:
    - from: development
      to: test
    - from: test
      to: qa
    - from: qa
      to: production-stage-1
    - from: production-stage-1
      to: main

  backflow:
    sources:
      - production-stage-1
      - main
    target: development
    strategy: cherry-pick
